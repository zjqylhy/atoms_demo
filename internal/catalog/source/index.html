<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atoms 示例应用</title><link rel="stylesheet" href="style.css"></head><body data-kind="TEMPLATE_KIND"><main><header><div><span class="eyebrow">ATOMS · EXAMPLE</span><h1 id="heading"></h1><p id="subtitle"></p></div><span id="count">加载中</span></header><section class="panel"><form id="entry-form"><label class="title-label">名称<input id="title" required maxlength="120" autocomplete="off"></label><div id="reading-fields" class="extra" hidden><label>作者<input id="author" maxlength="120"></label></div><div id="calculator-fields" class="extra" hidden><label>本金<input id="principal" type="number" min="0" max="1000000000" value="10000" required></label><label>年利率 (%)<input id="rate" type="number" min="-99" max="100" value="5" step="0.1" required></label><label>年数<input id="years" type="number" min="1" max="100" value="10" required></label></div><button id="add" disabled>添加</button></form><div class="toolbar"><input id="search" type="search" placeholder="搜索记录" aria-label="搜索记录"><span id="status" role="status">连接中…</span><button id="retry" hidden>重试保存</button><button id="reload">重新加载</button></div><div id="items"></div><p id="empty" hidden>暂无记录，添加第一条吧。</p></section><footer>业务记录通过 Atoms 数据服务保存。请等待“已保存”后再关闭页面。计算器仅作数学演示。</footer></main><script src="app.js"></script></body></html>
